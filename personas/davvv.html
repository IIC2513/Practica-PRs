<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning PRs</title>
    <style>
        body {
            color: rgb(9, 44, 75);
            display: flex;
            justify-content: center;
            background: linear-gradient(-90deg, #58fab1, #43ecbc, #3fedfa, #4389fa);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
    @keyframes gradient {
        0% {
            background-position: 0% 50%;
        }
        50% {
            background-position: 100% 50%;
        }
        100% {
            background-position: 0% 50%;
        }
    }
        div { 
            background-color: #b2f1fe;
            width: 60%;
            text-align: center;
            margin-top: 30px;
            border-radius: 20px;
        }

        h1, p, h2 {
            padding-top: 20px;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <h1>Learning How To Do a Pull Request</h1>
        <p>Hi! I'm learning all about how to use github to colaborate with my classmates!!</p>
        <h2>Bye! :3</h2>
    </div>
    
</body>
</html>
